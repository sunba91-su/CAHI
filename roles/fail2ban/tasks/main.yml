---
- name: Install Fail2ban
  apt:
    name: fail2ban
    state: present

- name: Inventory system services
  service_facts: null

- name: Start Fail2ban service
  systemd:
    name: fail2ban.service
    state: started
    enabled: true
  when: ansible_facts.services['fail2ban.service'] is defined

# ────────────────────────────────────────────────────────────────────
# Fail2ban jail configuration from CAPEv2/ansible
# ────────────────────────────────────────────────────────────────────

- name: Configure fail2ban jail.local
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart fail2ban

- name: Create custom CAPE web filter
  template:
    src: cape-web.conf.j2
    dest: /etc/fail2ban/filter.d/cape-web.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart fail2ban
